name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend tests and typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mvpconnect-app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mvpconnect-app/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run Jest
        run: npm test -- --ci
      - name: Run TypeScript
        run: npm run typecheck

  backend:
    name: Backend clean tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mvpconnect-svc
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run Maven clean test
        run: mvn clean test
