# Local-only MinIO settings. Activate with SPRING_PROFILES_ACTIVE=local.
media.storage.endpoint=${MEDIA_STORAGE_ENDPOINT:http://localhost:9000}
media.storage.path-style-access=${MEDIA_STORAGE_PATH_STYLE_ACCESS:true}
media.storage.access-key=${MEDIA_STORAGE_ACCESS_KEY:${MINIO_ROOT_USER:minioadmin}}
media.storage.secret-key=${MEDIA_STORAGE_SECRET_KEY:${MINIO_ROOT_PASSWORD:minioadmin}}

# Local diagnostics are detailed and retained in addition to the IntelliJ console.
logging.level.com.mint=${APP_LOG_LEVEL:DEBUG}
logging.level.org.neo4j.driver=INFO
logging.file.name=${LOG_FILE:logs/mvpconnect.log}
