# Local-only development defaults. Activate with SPRING_PROFILES_ACTIVE=local.
spring.neo4j.uri=${SPRING_NEO4J_URI:bolt://localhost:7687}
spring.neo4j.authentication.username=${SPRING_NEO4J_AUTHENTICATION_USERNAME:neo4j}
spring.neo4j.authentication.password=${SPRING_NEO4J_AUTHENTICATION_PASSWORD:changeme}
spring.data.neo4j.database=${SPRING_DATA_NEO4J_DATABASE:neo4j}
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

# Local-only MinIO settings.
media.storage.endpoint=${MEDIA_STORAGE_ENDPOINT:http://localhost:9000}
media.storage.path-style-access=${MEDIA_STORAGE_PATH_STYLE_ACCESS:true}
media.storage.access-key=${MEDIA_STORAGE_ACCESS_KEY:${MINIO_ROOT_USER:minioadmin}}
media.storage.secret-key=${MEDIA_STORAGE_SECRET_KEY:${MINIO_ROOT_PASSWORD:minioadmin}}

# Local diagnostics are detailed and retained in addition to the IntelliJ console.
logging.level.com.mint=${APP_LOG_LEVEL:DEBUG}
logging.level.org.neo4j.driver=INFO
logging.file.name=${LOG_FILE:logs/mvpconnect.log}

# Local-only session contract. A blank key generates an ephemeral key at startup.
auth.session.issuer=${AUTH_SESSION_ISSUER:mvpconnect-local}
auth.session.audience=${AUTH_SESSION_AUDIENCE:mvpconnect-api-local}
