# Application Configuration
spring.application.name=MVPConnect
server.port=8080
# No context-path - APIs will be at root level (e.g., /auth/login)

# Neo4j Configuration
spring.neo4j.uri=bolt://localhost:7687
spring.neo4j.authentication.username=neo4j
spring.neo4j.authentication.password=changeme

# Neo4j Database Settings
spring.data.neo4j.database=neo4j

# JWT Configuration
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=86400000

# Logging. Detailed application/database flow logs can be enabled with
# APP_LOG_LEVEL=DEBUG without enabling noisy or sensitive framework debug output.
logging.level.root=INFO
logging.level.com.mint=${APP_LOG_LEVEL:INFO}
logging.level.org.springframework.security=WARN
logging.level.org.neo4j.driver=WARN
logging.pattern.level=%5p [requestId:%X{requestId:-none}] [accountId:%X{accountId:-anonymous}] [persona:%X{persona:-unknown}]
logging.logback.rollingpolicy.max-file-size=${LOG_MAX_FILE_SIZE:20MB}
logging.logback.rollingpolicy.max-history=${LOG_MAX_HISTORY:30}
logging.logback.rollingpolicy.total-size-cap=${LOG_TOTAL_SIZE_CAP:1GB}
observability.logging.slow-operation-threshold-ms=${SLOW_OPERATION_THRESHOLD_MS:1000}

# CORS Configuration (will be handled in security config)
# For production, set specific allowed origins via environment variable
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:8081,http://localhost:8082,http://localhost:19000,http://localhost:19006,http://localhost:8097}

# Private image storage. Production normally omits endpoint/access-key/secret-key so the
# AWS SDK uses standard S3 endpoints and its default IAM credential provider chain.
media.storage.bucket=${MEDIA_STORAGE_BUCKET:mvpconnect-media}
media.storage.region=${AWS_REGION:us-east-1}
media.storage.endpoint=${MEDIA_STORAGE_ENDPOINT:}
media.storage.path-style-access=${MEDIA_STORAGE_PATH_STYLE_ACCESS:false}
media.storage.access-key=${MEDIA_STORAGE_ACCESS_KEY:}
media.storage.secret-key=${MEDIA_STORAGE_SECRET_KEY:}
media.storage.max-file-size=${MEDIA_STORAGE_MAX_FILE_SIZE:10MB}
media.storage.upload-url-expiration=${MEDIA_UPLOAD_URL_EXPIRATION:15m}
media.storage.access-url-expiration=${MEDIA_ACCESS_URL_EXPIRATION:15m}

# Google Places (New) is called only from the authenticated server-side location proxy.
# Leave the key empty to keep manual location entry enabled without suggestions.
google.places.api-key=${GOOGLE_PLACES_API_KEY:}
google.places.base-url=${GOOGLE_PLACES_BASE_URL:https://places.googleapis.com}
google.places.connect-timeout=${GOOGLE_PLACES_CONNECT_TIMEOUT:3s}
google.places.read-timeout=${GOOGLE_PLACES_READ_TIMEOUT:8s}

# Spotify Client Credentials are backend-only. Leave blank to keep all non-Spotify
# functionality available while Spotify calls return the safe SPOTIFY_UNAVAILABLE error.
spotify.client-id=${SPOTIFY_CLIENT_ID:}
spotify.client-secret=${SPOTIFY_CLIENT_SECRET:}
spotify.accounts-base-url=${SPOTIFY_ACCOUNTS_BASE_URL:https://accounts.spotify.com}
spotify.api-base-url=${SPOTIFY_API_BASE_URL:https://api.spotify.com}
spotify.connect-timeout=${SPOTIFY_CONNECT_TIMEOUT:3s}
spotify.read-timeout=${SPOTIFY_READ_TIMEOUT:8s}

# External OAuth providers. Missing provider credentials or encryption key leave the
# rest of the application available and fail only connection operations safely.
youtube.oauth.client-id=${YOUTUBE_CLIENT_ID:}
youtube.oauth.client-secret=${YOUTUBE_CLIENT_SECRET:}
youtube.oauth.redirect-uri=${YOUTUBE_REDIRECT_URI:http://localhost:8080/external-connections/oauth/youtube/callback}
youtube.oauth.authorization-base-url=${YOUTUBE_AUTHORIZATION_BASE_URL:https://accounts.google.com}
youtube.oauth.token-base-url=${YOUTUBE_TOKEN_BASE_URL:https://oauth2.googleapis.com}
youtube.oauth.api-base-url=${YOUTUBE_API_BASE_URL:https://www.googleapis.com}
youtube.oauth.connect-timeout=${YOUTUBE_CONNECT_TIMEOUT:3s}
youtube.oauth.read-timeout=${YOUTUBE_READ_TIMEOUT:8s}

soundcloud.oauth.client-id=${SOUNDCLOUD_CLIENT_ID:}
soundcloud.oauth.client-secret=${SOUNDCLOUD_CLIENT_SECRET:}
soundcloud.oauth.redirect-uri=${SOUNDCLOUD_REDIRECT_URI:http://localhost:8080/external-connections/oauth/soundcloud/callback}
soundcloud.oauth.authorization-base-url=${SOUNDCLOUD_AUTHORIZATION_BASE_URL:https://secure.soundcloud.com}
soundcloud.oauth.api-base-url=${SOUNDCLOUD_API_BASE_URL:https://api.soundcloud.com}
soundcloud.oauth.connect-timeout=${SOUNDCLOUD_CONNECT_TIMEOUT:3s}
soundcloud.oauth.read-timeout=${SOUNDCLOUD_READ_TIMEOUT:8s}

oauth.encryption.key-base64=${OAUTH_TOKEN_ENCRYPTION_KEY_BASE64:}
oauth.encryption.key-version=${OAUTH_TOKEN_ENCRYPTION_KEY_VERSION:1}
oauth.return.attempt-ttl=${OAUTH_ATTEMPT_TTL:10m}
oauth.return.allowed-targets=${OAUTH_RETURN_ALLOWED_TARGETS:mvpconnect://oauth/result,http://localhost:19006/oauth/result,http://localhost:8081/oauth/result,http://localhost:8082/oauth/result,http://localhost:8097/oauth/result}

# Standard Actuator probes. Liveness only reflects the application process;
# readiness requires both Neo4j and object storage.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-components=always
management.endpoint.health.show-details=never
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.liveness.show-components=always
management.endpoint.health.group.readiness.include=readinessState,neo4j,objectStorage
management.endpoint.health.group.readiness.show-components=always
